<!DOCTYPE html>
<html>
<head>
    <title>IoMT Health Prediction</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            padding: 40px;
        }
        form {
            background: white;
            padding: 25px;
            width: 350px;
            border-radius: 8px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        h2 {
            color: #2c3e50;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

<h2>IoMT Patient Health Alert Prediction</h2>

<form method="POST">
    {% csrf_token %}
    <input type="number" step="any" name="heart_rate" placeholder="Heart Rate (bpm)" required>
    <input type="number" step="any" name="spo2" placeholder="SpO2 Level (%)" required>
    <input type="number" step="any" name="systolic" placeholder="Systolic BP" required>
    <input type="number" step="any" name="diastolic" placeholder="Diastolic BP" required>
    <input type="number" step="any" name="temperature" placeholder="Body Temperature (°C)" required>

    <button type="submit">Predict Alert</button>
</form>

{% if prediction %}
    <div class="result">
        Predicted Alert Status: {{ prediction }}
    </div>
{% endif %}

</body>
</html>
